name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_VER (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore verified at ./debug.keystore"
          else
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching for APKs within app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH exists but is empty or not a regular file."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "Error: $APK_PATH does not have .apk extension."
              exit 1
            ;;
          esac

          echo "Verified APK successfully: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_DIR}/app-debug.apk"
          echo "asset_path=${ASSET_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${ASSET_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared asset $ASSET_PATH is missing or empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            */app-debug.apk) ;;
            *)
              echo "Error: Asset filename must be app-debug.apk"
              exit 1
            ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<'EOF'
          ### Debug APK Build Details
          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Notice:** This APK is intended for testing only. It is not a Google Play Store production release and is signed with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release APK Filename: app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct download link for latest debug APK:" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Note: The standard GitHub Actions backup artifact \`app-debug-apk\` is also preserved and available in the run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The debug APK build and verification succeeded."
            echo "The backup Actions artifact 'app-debug-apk' remains available for download from this workflow run."
            echo "Do not use the direct latest release link until release publishing succeeds."

            echo "## APK Build Succeeded (Release Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and uploaded as a GitHub Actions backup artifact (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete. Please download the artifact directly from this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
